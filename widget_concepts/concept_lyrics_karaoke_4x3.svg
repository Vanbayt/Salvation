<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E222A"/>
      <stop offset="100%" stop-color="#14171E"/>
    </linearGradient>
    <linearGradient id="activePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#173562"/>
      <stop offset="100%" stop-color="#1D437D"/>
    </linearGradient>
    <linearGradient id="primaryPlay3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8C7FA"/>
      <stop offset="100%" stop-color="#7CA8F8"/>
    </linearGradient>
    <linearGradient id="progressGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7CA8F8"/>
      <stop offset="100%" stop-color="#A8C7FA"/>
    </linearGradient>
    <clipPath id="albumClip3">
      <rect x="32" y="26" width="76" height="76" rx="26" ry="26"/>
    </clipPath>
  </defs>

  <style>
    .f-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; font-weight: 700; }
    .f-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; font-weight: 500; }
    .f-mono { font-family: "SF Mono", "Roboto Mono", "Adwaita Mono", monospace; font-weight: 600; }
  </style>

  <!-- Pure Widget Card Body (rx="64" at 2x / 32dp, surfaceContainer #1E222A) -->
  <rect x="1" y="1" width="718" height="538" rx="64" fill="url(#cardBg3)" stroke="#3E4552" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Header Bar: Mini Squircle Album Art (18dp rx) + Track Info + 24-96 Badge + Mini Controls -->
  <!-- Mini Squircle Album Art -->
  <g clip-path="url(#albumClip3)">
    <rect x="32" y="26" width="76" height="76" fill="#18070D"/>
    <!-- The Weeknd - After Hours Stylized Graphic -->
    <circle cx="70" cy="64" r="34" fill="#BE123C" opacity="0.85"/>
    <circle cx="70" cy="64" r="22" fill="#E11D48"/>
    <!-- Glowing neon center & sunglasses reflection silhouette -->
    <ellipse cx="70" cy="58" rx="14" ry="7" fill="#1C0A10" opacity="0.9"/>
    <ellipse cx="64" cy="58" rx="4" ry="2.5" fill="#FFE4E6" opacity="0.8"/>
    <ellipse cx="76" cy="58" rx="4" ry="2.5" fill="#FFE4E6" opacity="0.8"/>
    <!-- Red jacket silhouette collar -->
    <path d="M42 96 L70 76 L98 96 Z" fill="#9F1239"/>
    <circle cx="70" cy="64" r="10" fill="#FFE4E6" opacity="0.3"/>
  </g>
  <rect x="32" y="26" width="76" height="76" rx="26" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Title & 24-96 Hi-Res Badge -->
  <text x="124" y="55" class="f-bold" font-size="22" fill="#E2E2E9">Blinding Lights</text>
  
  <rect x="296" y="38" width="66" height="24" rx="12" fill="#142B4D" stroke="#2B5188" stroke-width="1"/>
  <circle cx="308" cy="50" r="3" fill="#4ADE80"/>
  <text x="317" y="55" class="f-mono" font-size="11" fill="#A8C7FA">24-96</text>

  <!-- Artist & Album -->
  <text x="124" y="84" class="f-medium" font-size="15" fill="#A4A8B5">The Weeknd • After Hours</text>

  <!-- Mini Playback Control Pill in Header (Play/Pause, Next) -->
  <rect x="560" y="40" width="128" height="46" rx="23" fill="#252A34" stroke="#3A404D" stroke-width="1.2"/>
  
  <!-- Pause Button Circle -->
  <g transform="translate(568, 47)">
    <circle cx="16" cy="16" r="16" fill="url(#primaryPlay3)"/>
    <rect x="11.5" y="9" width="3.5" height="14" rx="1.5" fill="#0A2E66"/>
    <rect x="17" y="9" width="3.5" height="14" rx="1.5" fill="#0A2E66"/>
  </g>

  <!-- Next Track Button -->
  <g transform="translate(632, 49)" fill="#E2E2E9">
    <path d="M7 6v16l12-8-12-8zm13 0v16h3V6h-3z" fill="currentColor"/>
  </g>

  <!-- Hairline Header Divider -->
  <line x1="32" y1="118" x2="688" y2="118" stroke="#2D3340" stroke-width="1.2"/>

  <!-- Main Synced Lyrics Body -->
  <!-- Line 1 (Past Line - Muted) -->
  <g transform="translate(32, 134)">
    <rect x="0" y="0" width="56" height="24" rx="12" fill="#222630"/>
    <text x="12" y="16" class="f-mono" font-size="11.5" fill="#717684">01:14</text>
    <text x="70" y="18" class="f-medium" font-size="17" fill="#717684">I've been on my own for long enough</text>
  </g>

  <!-- Line 2 (ACTIVE KARAOKE LINE - High Contrast M3 PrimaryContainer Pill, rx="28") -->
  <g transform="translate(32, 176)">
    <rect x="0" y="0" width="656" height="142" rx="28" fill="url(#activePillGrad)" stroke="#4A75B5" stroke-width="1.5"/>
    
    <!-- Time Badge '01:22' -->
    <rect x="22" y="20" width="62" height="26" rx="13" fill="#0E2445" stroke="#254B82" stroke-width="1"/>
    <text x="34" y="38" class="f-mono" font-size="12" fill="#A8C7FA">01:22</text>

    <!-- Animated Wave Bars -->
    <g transform="translate(98, 23)" fill="#4ADE80">
      <rect x="0" y="8" width="3.5" height="12" rx="1.75"/>
      <rect x="6.5" y="2" width="3.5" height="18" rx="1.75"/>
      <rect x="13" y="10" width="3.5" height="10" rx="1.75"/>
      <rect x="19.5" y="0" width="3.5" height="20" rx="1.75"/>
      <rect x="26" y="5" width="3.5" height="15" rx="1.75"/>
    </g>

    <!-- Active Lyric Text (Bold with Word Highlight) -->
    <text x="22" y="86" class="f-bold" font-size="23" fill="#FFFFFF">I said, ooh, <tspan fill="#A8C7FA" font-weight="800">I'm blinded</tspan> by the lights</text>
    
    <!-- Russian Translation Line -->
    <text x="22" y="118" class="f-medium" font-size="15" fill="#C2D8FF">RU «Я сказал: о, я ослеплен этим сиянием огней...»</text>
  </g>

  <!-- Line 3 (Upcoming Line +1) -->
  <g transform="translate(32, 336)">
    <rect x="0" y="0" width="56" height="24" rx="12" fill="#222630"/>
    <text x="12" y="16" class="f-mono" font-size="11.5" fill="#8C919D">01:28</text>
    <text x="70" y="18" class="f-medium" font-size="17.5" fill="#A4A8B5">No, I can't sleep until I feel your touch</text>
  </g>

  <!-- Line 4 (Upcoming Line +2, subtle) -->
  <g transform="translate(32, 378)">
    <rect x="0" y="0" width="56" height="24" rx="12" fill="#20232A"/>
    <text x="12" y="16" class="f-mono" font-size="11.5" fill="#585D6B">01:35</text>
    <text x="70" y="18" class="f-medium" font-size="17.5" fill="#585D6B">I said, ooh, I'm drowning in the night</text>
  </g>

  <!-- Hairline Dock Divider -->
  <line x1="32" y1="428" x2="688" y2="428" stroke="#282D38" stroke-width="1"/>

  <!-- Bottom Dock: Status Badges & Progress Bar -->
  <g transform="translate(32, 448)">
    <!-- KARAOKE SYNC 2.0 Pill with Green Pulse Dot -->
    <rect x="0" y="0" width="186" height="42" rx="21" fill="#14243D" stroke="#2B5188" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="8" fill="#4ADE80" fill-opacity="0.25"/>
    <circle cx="22" cy="21" r="4.5" fill="#4ADE80"/>
    <text x="38" y="26" class="f-bold" font-size="11.5" fill="#A8C7FA" letter-spacing="0.5">KARAOKE SYNC 2.0</text>

    <!-- EN ⇄ RU • ON Pill -->
    <rect x="198" y="0" width="134" height="42" rx="21" fill="#242832" stroke="#3A404D" stroke-width="1.2"/>
    <text x="212" y="26" class="f-mono" font-size="11.5" fill="#C5C7D2">EN ⇄ RU • ON</text>

    <!-- Progress Scrubber Dock Bar & Timestamps -->
    <text x="352" y="14" class="f-mono" font-size="11" fill="#8C919D">01:22</text>
    <text x="626" y="14" class="f-mono" font-size="11" fill="#8C919D">03:20</text>
    <rect x="352" y="22" width="304" height="8" rx="4" fill="#2C313C"/>
    <rect x="352" y="22" width="138" height="8" rx="4" fill="url(#progressGrad3)"/>
    <circle cx="490" cy="26" r="7" fill="#E2E2E9"/>
  </g>
</svg>